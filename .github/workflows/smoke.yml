name: smoke
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: uv sync --frozen
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libnetcdf-dev
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup_runtime.ps1
      - if: runner.os == 'Linux'
        run: mkdir -p runtime/plotly && cp .venv/lib/python3.12/site-packages/plotly/package_data/plotly.min.js runtime/plotly/
      - run: dotnet build MeteoBridge.sln -c Release
      - run: uv run ruff check .
      - run: uv run pytest -p no:cacheprovider
      - run: node --test tests/map_viewer.test.cjs
