[project]
name = "meteo-bridge"
version = "0.1.0"
description = "Conditional query bounds for accumulated precipitation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.2,<3", "scipy>=1.15,<2", "pydantic>=2.10,<3",
  "pyarrow>=19,<24", "pandas>=2.2,<3", "pint>=0.24,<1",
  "netCDF4>=1.7,<2", "xarray>=2025.1", "dask[array]>=2025.1",
  "typer>=0.15,<1", "pyyaml>=6,<7", "psutil>=7,<8",
  "httpx>=0.28,<1", "streamlit>=1.42,<2", "plotly>=6,<7",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20",
]

[dependency-groups]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "ruff>=0.11,<1"]

[project.scripts]
meteo = "meteo_bridge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meteo_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".uv-cache", ".uv-python", ".venv", "data", "experiments", "reports"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
