[project]
name = "meteo-bridge"
version = "0.1.0"
description = "Development checks and runtime preparation for the C# ERA5 viewer"
requires-python = ">=3.12,<3.13"
dependencies = [
  "netCDF4>=1.7,<2", "plotly>=6,<7",
]

[dependency-groups]
dev = ["numpy>=2.2,<3", "httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".uv-cache", ".uv-python", ".venv", "data", "artifacts", "runtime"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
